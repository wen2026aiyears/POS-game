<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模擬 POS 機點餐訓練遊戲</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .game-container { display: flex; width: 1000px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 12px; overflow: hidden; }
        .pos-screen { flex: 2; padding: 20px; display: flex; flex-direction: column; border-right: 2px solid #e0e0e0; }
        .sidebar { flex: 1; padding: 20px; background: #2c3e50; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1-fr); gap: 12px; margin-bottom: 20px; }
        .menu-item { background: #3498db; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: bold;}
        .menu-item:hover { background: #2980b9; }
        .option-section { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #dee2e6; }
        .option-group { display: flex; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
        .opt-btn { background: #fff; border: 1px solid #ccc; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .opt-btn.active { background: #e67e22; color: white; border-color: #d35400; font-weight: bold; }
        .cart-list { border: 1px solid #ddd; height: 180px; overflow-y: auto; background: #fff; padding: 10px; border-radius: 6px; margin-top: 10px; }
        .cart-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #eee; font-size: 14px; color: #333; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; }
        .btn { padding: 15px; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .btn-clear { background: #e74c3c; color: white; }
        .btn-submit { background: #2ecc71; color: white; }
        .task-box { background: #e67e22; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 18px; font-weight: bold; border-left: 5px solid #d35400; }
        .score-board { font-size: 20px; margin-bottom: 10px; font-weight: bold; }
        .timer { font-size: 20px; color: #ff7675; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1 style="color: #2c3e50; margin-bottom: 10px;">🥤 飲料店 POS 機熟練度訓練</h1>
    <div class="timer">剩餘時間：<span id="time-left">60</span> 秒</div>

    <div class="game-container">
        <!-- POS 操作主畫面 -->
        <div class="pos-screen">
            <h3 style="margin-top:0; color:#555;">點餐面板</h3>
            
            <!-- 商品區 -->
            <div class="menu-grid">
                <button class="menu-item" onclick="selectProduct('珍珠奶茶', 55)">珍珠奶茶 $55</button>
                <button class="menu-item" onclick="selectProduct('經典紅茶', 30)">經典紅茶 $30</button>
                <button class="menu-item" onclick="selectProduct('四季春茶', 35)">四季春茶 $35</button>
                <button class="menu-item" onclick="selectProduct('香檸綠茶', 50)">香檸綠茶 $50</button>
                <button class="menu-item" onclick="selectProduct('芋頭鮮奶', 70)">芋頭鮮奶 $70</button>
                <button class="menu-item" onclick="selectProduct('百香雙響炮', 60)">百香雙響炮 $60</button>
            </div>

            <!-- 客製化規格選單 -->
            <div class="option-section">
                <div><strong>甜度調整：</strong></div>
                <div class="option-group" id="sugar-group">
                    <button class="opt-btn active" onclick="setOption('sugar', '正常糖')">正常糖</button>
                    <button class="opt-btn" onclick="setOption('sugar', '少糖')">少糖</button>
                    <button class="opt-btn" onclick="setOption('sugar', '半糖')">半糖</button>
                    <button class="opt-btn" onclick="setOption('sugar', '微糖')">微糖</button>
                    <button class="opt-btn" onclick="setOption('sugar', '無糖')">無糖</button>
                </div>
            </div>

            <div class="option-section">
                <div><strong>冰塊調整：</strong></div>
                <div class="option-group" id="ice-group">
                    <button class="opt-btn active" onclick="setOption('ice', '正常冰')">正常冰</button>
                    <button class="opt-btn" onclick="setOption('ice', '少冰')">少冰</button>
                    <button class="opt-btn" onclick="setOption('ice', '微冰')">微冰</button>
                    <button class="opt-btn" onclick="setOption('ice', '去冰')">去冰</button>
                    <button class="opt-btn" onclick="setOption('ice', '完全去冰')">完全去冰</button>
                </div>
            </div>

            <button class="btn btn-submit" style="background:#9b59b6; margin-top:10px;" onclick="addToCart()">➕ 加入購物車</button>
        </div>

        <!-- 右側明細與任務提示 -->
        <div class="sidebar">
            <div>
                <div class="score-board">得分：<span id="score">0</span></div>
                <div class="task-box">
                    🎯 顧客訂單：<br>
                    <span id="task-text">載入中...</span>
                </div>
                <h3>🛒 目前點購明細</h3>
                <div class="cart-list" id="cart-display"></div>
                <h2 style="text-align: right; margin-top: 15px;">總計: $<span id="total-price">0</span></h2>
            </div>

            <div class="action-btns">
                <button class="btn btn-clear" onclick="clearCart()">清除</button>
                <button class="btn btn-submit" onclick="checkAnswer()">結帳送出</button>
            </div>
        </div>
    </div>

    <script>
        // 遊戲資料與狀態
        const products = ['珍珠奶茶', '經典紅茶', '四季春茶', '香檸綠茶', '芋頭鮮奶', '百香雙響炮'];
        const sugars = ['正常糖', '少糖', '半糖', '微糖', '無糖'];
        const ices = ['正常冰', '少冰', '微冰', '去冰', '完全去冰'];
        
        let currentTask = {};
        let currentSelection = { name: '珍珠奶茶', price: 55, sugar: '正常糖', ice: '正常冰' };
        let cart = [];
        let score = 0;
        let timeLeft = 60;
        let gameInterval;

        // 初始化遊戲
        function startGame() {
            generateTask();
            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(gameInterval);
                    alert(`遊戲結束！您的最終得分是：${score} 分`);
                    location.reload();
                }
            }, 1000);
        }

        // 隨機出題
        function generateTask() {
            const randomProd = products[Math.floor(Math.random() * products.length)];
            const randomSugar = sugars[Math.floor(Math.random() * sugars.length)];
            const randomIce = ices[Math.floor(Math.random() * ices.length)];
            currentTask = { name: randomProd, sugar: randomSugar, ice: randomIce };
            document.getElementById('task-text').innerHTML = `👉 <span style="color:#fff; background:#c0392b; padding:2px 6px; border-radius:4px;">${randomProd}</span><br>【${randomSugar} / ${randomIce}】`;
        }

        // 選擇商品
        function selectProduct(name, price) {
            currentSelection.name = name;
            currentSelection.price = price;
            alert(`已選取: ${name}`);
        }

        // 選擇規格 (甜度/冰塊)
        function setOption(type, value) {
            currentSelection[type] = value;
            const container = document.getElementById(`${type}-group`);
            const buttons = container.getElementsByClassName('opt-btn');
            for (let btn of buttons) {
                if (btn.innerText === value) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        }

        // 加入購物車
        function addToCart() {
            cart.push({ ...currentSelection });
            updateCartDisplay();
        }

        // 更新購物車顯示
        function updateCartDisplay() {
            const container = document.getElementById('cart-display');
            container.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                container.innerHTML += `<div class="cart-item"><span>${item.name} (${item.sugar}/${item.ice})</span><span>$${item.price}</span></div>`;
            });
            document.getElementById('total-price').innerText = total;
        }

        // 清除購物車
        function clearCart() {
            cart = [];
            updateCartDisplay();
        }

        // 檢查答案是否正確
        function checkAnswer() {
            if (cart.length === 1 && 
                cart[0].name === currentTask.name && 
                cart[0].sugar === currentTask.sugar && 
                cart[0].ice === currentTask.ice) {
                score += 10;
                document.getElementById('score').innerText = score;
                alert('🎯 點單正確！得分 +10');
                clearCart();
                generateTask();
            } else {
                alert('❌ 點單錯誤或明細不符，請重新核對客人的要求！');
                clearCart();
            }
        }

        // 啟動
        window.onload = startGame;
    </script>
</body>
</html>
